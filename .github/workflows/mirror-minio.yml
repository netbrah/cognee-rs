name: Mirror minio images

# One-shot registry mirror: MinIO removed its images from Docker Hub (pulls
# deny from every network we control AND from GitHub runners — the tags
# simply no longer exist there), so the source is quay.io, MinIO's primary
# registry since 2021. Relay the two images needed by apex-beads-origin (S3
# origin for dolt replication) through this runner into ghcr, from where the
# Mac relays them into docker.repo.eng.netapp.com/user/palanisd/ (two-stage
# pattern proven for cognee-rs-delta). Dispatch-only.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  MINIO_TAG: RELEASE.2025-09-07T16-13-09Z
  MC_TAG: RELEASE.2025-08-13T08-35-41Z

jobs:
  mirror:
    runs-on: ubuntu-24.04
    steps:
      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Relay minio server
        run: |
          docker pull --platform linux/amd64 quay.io/minio/minio:${MINIO_TAG}
          docker tag quay.io/minio/minio:${MINIO_TAG} \
            ghcr.io/${{ github.repository_owner }}/mirror-minio:${MINIO_TAG}
          docker push ghcr.io/${{ github.repository_owner }}/mirror-minio:${MINIO_TAG}

      - name: Relay minio client
        run: |
          docker pull --platform linux/amd64 quay.io/minio/mc:${MC_TAG}
          docker tag quay.io/minio/mc:${MC_TAG} \
            ghcr.io/${{ github.repository_owner }}/mirror-mc:${MC_TAG}
          docker push ghcr.io/${{ github.repository_owner }}/mirror-mc:${MC_TAG}
