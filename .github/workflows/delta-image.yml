name: Delta deploy image

# Delta-lane build: standalone cognee-http-server -> ghcr.io image for the
# kube deployment. Not part of upstream release machinery; dispatch-only.
# Build recipe mirrors http-parity's "build on the runner, not in the image"
# (same toolchain, mold, cmake+protoc for lbug's bundled C++, ORT cache),
# minus the dev-mock harness feature.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (ghcr.io/<owner>/cognee-rs-delta:<tag>)"
        required: false
        default: "main"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cognee-rs-delta

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        # rustup show installs from rust-toolchain.toml
        run: rustup show

      - name: Install mold linker
        uses: rui314/setup-mold@v1
        with:
          make-default: true

      # cmake + protoc: lbug's bundled Ladybug C++ tree and the prost build.
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake protobuf-compiler

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: delta-image-release-v1

      - name: Cache ORT binary
        uses: actions/cache@v4
        with:
          path: target/ort-cache
          key: ort-v2.0.0-rc.12-cpu-linux-x86_64

      - name: Build release binary
        env:
          ORT_CACHE_DIR: ${{ github.workspace }}/target/ort-cache
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_RELEASE_DEBUG: "0"
        run: cargo build --release -p cognee-http-server --features cognee-http-server/bin

      - name: Stage dist
        run: |
          mkdir -p dist
          cp target/release/cognee-http-server dist/
          dist/cognee-http-server --version || true
          ldd dist/cognee-http-server | head -20

      - name: Build image
        run: docker build -f deploy/delta/Dockerfile -t "$IMAGE:${{ inputs.tag }}" .

      - name: Push image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ inputs.tag }}"
          # Pin-friendly digest for the chart's image.digest value.
          docker inspect --format='IMAGE_DIGEST {{index .RepoDigests 0}}' "$IMAGE:${{ inputs.tag }}"
